<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="손솔 진보당 국회의원" />
    <meta property="og:description" content="손솔 국회의원의 월간 웹진 입니다" />
    <meta property="og:url" content="" />
    <meta property="og:image" content="" />
    <title>손솔 진보당 국회의원</title>
    <!-- <link rel="shortcut icon" href="img/favicon.ico" /> -->
    <link rel="stylesheet" href="css/style.css?v=2025" />
    <style>
        body {
            background-color: #94e0c2;
        }
    </style>

</head>

<body>
    <main class="main-page">
        <section class="content support green" id="support">
            <div class="content-title">
                <div>
                    <span>후원 안내</span>
                    <h2>후원으로 손솔을 키워주세요!</h2>
                    <p>
                        다가온 연말, 손솔의 든든한 편이 되어주세요.<br>
                        열정적인 의정활동으로 보답하겠습니다.
                    </p>
                </div>
            </div>
            <div class="support-box">
                <div class="support-item" id="copyAccount">
                    <h4>후원 계좌</h4>
                    <p>
                        <span id="accountNumber">농협 301-0373-2658-21</span><br>
                        <span>(국회의원 손솔 후원회)</span>
                    </p>
                </div>
                <div class="support-item pay">
                    <a href="https://www.give.go.kr/portal/donation/support/forInsertStep01.do?menuNo=200019"
                        target="_blank">
                        <h4>정치후원금 센터 이용</h4>
                        <p>카카오페이 등 간편결제/카드결제/실시간계좌이체</p>
                    </a>
                </div>
                <div class="support-item cms">
                    <a href="https://www.ihappynanum.com/Nanum/B/JBX879OKZX" target="_blank">
                        <h4>CMS를 통한 정기 후원</h4>
                        <p>매월 정기 후원을 해주시면 더 큰 힘이 됩니다.</p>
                    </a>
                </div>
                <div class="support-item receipt">
                    <a href="https://forms.gle/ZTwk7uMvyrM3Jbwd8" target="_blank">
                        <h4>후원금 영수증 신청</h4>
                        <p>신청폼에 맞춰 정보를 입력해주시면 영수증이 발행됩니다.</p>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.getElementById("copyAccount").addEventListener("click", function () {
            const text = document.getElementById("accountNumber").innerText;

            navigator.clipboard.writeText(text).then(() => {
                alert("계좌번호가 복사되었습니다: " + text);
            });
        });
    </script>

</body>

</html>
