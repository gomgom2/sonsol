<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8" />
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta property="og:title" content="월간손솔 2월호" />
	<meta property="og:description" content="손솔 국회의원의 월간 웹진 입니다" />
	<meta property="og:url" content="https://sonsol.kr/2604/" />
	<meta property="og:image" content="contents/thumb.jpg" />
	<title>손솔 진보당 국회의원</title>
	<!-- <link rel="shortcut icon" href="img/favicon.ico" /> -->
	<link rel="stylesheet" href="css/style.css?v=2026" />
	<link rel="stylesheet" href="https://unpkg.com/swiper@11/swiper-bundle.min.css" />
</head>

<body>
	<main class="main-page">
		<section class="main-visual">
			<div class="main-visual-bg">
				<img src="contents/main_visual.jpg" alt="월간손솔 4월호" />
			</div>
			<div class="main-visual-inner">
				<h1>
					정치검찰과의<br>
					정면승부
				</h1>
				<div class="cover-box">
					<h2 class="no-show">월간 손솔</h2>
					<!-- 구멍 뚫린 박스를 그리는 SVG -->
					<svg class="cover-svg" viewBox="0 0 110 120" aria-hidden="true">
						<defs>
							<mask id="cover-text-mask">
								<!-- 전체 영역 흰색(=보여질 부분) -->
								<rect x="0" y="0" width="100%" height="100%" fill="white" />
								<!-- 글자 부분 검정(=뚫릴 부분) -->
								<text x="50%" y="32%" text-anchor="middle" dominant-baseline="middle" font-size="60"
									font-family="Presentation, sans-serif" font-weight="800" fill="black">
									월간
								</text>
								<text x="50%" y="77%" text-anchor="middle" dominant-baseline="middle" font-size="60"
									font-family="Presentation, sans-serif" font-weight="800" fill="black">
									손솔
								</text>
							</mask>
						</defs>

						<!-- 흰 박스에 위에서 만든 마스크를 적용 = 글자 모양만 뚫림 -->
						<rect x="0" y="0" width="100%" height="100%" fill="white" mask="url(#cover-text-mask)" />
					</svg>
				</div>
				<p>국회의원 손솔 의정보고서<br><span>2026년 4월호</span></p>
			</div>
			<figure class="cover-logo">
				<img src="images/logo-wh.png">
			</figure>
		</section>
		<section class="content content-1">
			<div class="content-head">
				<div class="profile">
					<img src="contents/profile-1.jpg">
				</div>
				<div class="content-stitle">
					<h3>대장동 국정조사<span>4.16</span></h3>
				</div>
			</div>
		</section>
	</main>
</body>

</html>
